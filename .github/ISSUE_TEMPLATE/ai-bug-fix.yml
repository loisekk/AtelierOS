name: "🐛 AI Bug Fix Task"
description: "Report a bug with reproduction steps for an AI Contributor agent to diagnose and fix"
title: "[BUG]: "
labels: ["ai-contribution", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### AI Contributor Bug Fix Request
        Provide clear reproduction steps, current vs expected behavior, and error tracebacks.
  - type: dropdown
    id: assigned_agent
    attributes:
      label: "Target AI Contributor"
      description: "Select which AI platform is assigned to fix this bug"
      options:
        - "Anthropic — Claude Code (agent:claude)"
        - "OpenAI — Codex (agent:codex)"
        - "Cursor — Background Agent (agent:cursor)"
        - "GitHub Copilot — Coding Agent (agent:copilot)"
        - "Any Available Agent"
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: "Bug Summary"
      description: "What went wrong?"
      placeholder: "A clear and concise description of the bug..."
    validations:
      required: true
  - type: textarea
    id: repro_steps
    attributes:
      label: "Reproduction Steps"
      description: "Step-by-step instructions or minimal script to reproduce the bug"
      placeholder: "1. Run command `...`\n2. Pass input `...`\n3. Observe error `...`"
    validations:
      required: true
  - type: textarea
    id: error_traceback
    attributes:
      label: "Error Traceback or Terminal Output"
      description: "Paste complete error stack traces or failing test outputs"
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected Behavior"
      description: "What should happen once the bug is resolved?"
    validations:
      required: true
  - type: textarea
    id: verification_test
    attributes:
      label: "Verification Test Command"
      description: "Command to execute to verify that the bug is fixed and no regressions occurred"
      placeholder: "pytest tests/test_bug.py -v"
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: "Guardrails"
      options:
        - label: "Agent must add a regression test covering this bug."
          required: true
        - label: "Agent must not modify unrelated files."
          required: true
